name: Checks
# The repo's own checks, as steps of one job: shellcheck over every script, then
# the plain-bash test suite. Both take seconds, and GitHub bills every job for at
# least a full minute, so they share one.
#
# Pull requests only, and not while the PR is a draft. There is no push trigger:
# the PR run already checked the tree being merged.
#
# shellcheck is the pinned release binary, checked against the SHA-256 GitHub
# records for the release asset, so the version never drifts with the runner
# image. jq ships on ubuntu-latest.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    name: ✅ Checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: v0.11.0
      # SHA-256 of shellcheck-<version>.linux.x86_64.tar.xz. Update it together
      # with SHELLCHECK_VERSION.
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
      - name: 🐚 Install shellcheck
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/shellcheck/bin"
          mkdir -p "$bin"
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          mv "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$bin/"
          echo "$bin" >> "$GITHUB_PATH"
      - name: 🧹 Shellcheck
        # The governance hooks under .claude/ are owned by the hub and linted there.
        run: git ls-files -z -- '*.sh' ':!:.claude/**' | xargs -0 -r shellcheck
      - name: 🧪 Tests
        if: ${{ !cancelled() }}
        run: bash tests/run.sh
