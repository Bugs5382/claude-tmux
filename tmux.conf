# Mouse: trackpad scrolls history, drag copies to the clipboard, click focuses a pane.
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g status-left-length 40
set -g status-left '#[bold] #S #[default] '

# Clipboard: pbcopy on macOS; on Linux wl-copy in a Wayland session, xclip in an X11 one, and
# otherwise (over SSH) OSC 52, which hands the copy to the terminal you are typing in. Chosen
# when tmux loads this file, from the environment the server started with.
if-shell 'command -v pbcopy >/dev/null' {
  set -s set-clipboard off
  bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel pbcopy
  bind -T copy-mode    y send -X copy-pipe-and-cancel pbcopy
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy
} {
  if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null' {
    set -s set-clipboard off
    bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel wl-copy
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel wl-copy
    bind -T copy-mode    y send -X copy-pipe-and-cancel wl-copy
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel wl-copy
  } {
    if-shell 'test -n "$DISPLAY" && command -v xclip >/dev/null' {
      set -s set-clipboard off
      bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
      bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
      bind -T copy-mode    y send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
      bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard -in'
    } {
      set -s set-clipboard on
      bind -T copy-mode    MouseDragEnd1Pane send -X copy-selection-and-cancel
      bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
      bind -T copy-mode    y send -X copy-selection-and-cancel
      bind -T copy-mode-vi y send -X copy-selection-and-cancel
    }
  }
}

# Save right after a session or window closes so the next restore does not bring it back.
# tmux-restore sets @claude_tmux_restoring while it builds sessions; its placeholder window
# closes would otherwise save a half-restored server. The PATH covers ~/.local/bin and
# Homebrew when the server was started without them.
set-hook -g session-closed[42] {
  if -F '#{!=:#{@claude_tmux_restoring},1}' {
    run-shell -b 'PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" tmux-save --on-close'
  }
}
set-hook -g window-unlinked[42] {
  if -F '#{!=:#{@claude_tmux_restoring},1}' {
    run-shell -b 'PATH="$HOME/.local/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" tmux-save --on-close'
  }
}
